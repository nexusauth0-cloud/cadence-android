org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true

# Compose 1.9's Compose lint requires AGP 8.8.2; we stay on AGP 8.8.1 for the
# rest of the build, so pin just the lint engine to 8.8.2 via the experimental flag.
android.experimental.lint.version=8.8.2

# Configuration cache intentionally disabled for Phase 1: the architecture
# module injects resolved artifact paths into the test JVM at execution time
# (doFirst), which is incompatible with configuration-cache isolation.
# Revisit when the arch checks move to a dedicated Gradle plugin.
