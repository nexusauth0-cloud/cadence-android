name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Compilation + all unit tests across all modules.
      - name: Build and run unit tests
        run: ./gradlew build --stacktrace --no-daemon

      # Architecture enforcement (boundary checks, bytecode scans,
      # file-size budget, blocking-call detection, batching invariant).
      - name: Architecture enforcement
        run: ./gradlew :tests:architecture:test --stacktrace --no-daemon

      # E2E spike proof (SourceProvider → UseCase → Engine boundary).
      - name: E2E spike proof
        run: ./gradlew :tests:e2e:test --stacktrace --no-daemon
